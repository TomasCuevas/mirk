[workspace]
resolver = "2"
members = [
    "crates/oct-core",
    "crates/oct-platform",
    "crates/oct-store",
    "crates/oct-desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
authors = ["Tomás Cuevas"]
description = "Cross-platform PDF reading-progress tracker"
rust-version = "1.80"

[workspace.dependencies]
oct-core = { path = "crates/oct-core" }
oct-platform = { path = "crates/oct-platform" }
oct-store = { path = "crates/oct-store" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `bundled` compiles SQLite from source, so no system `libsqlite3` is required at build or
# runtime — which is what AppImage/MSI/dmg packaging needs. MIT licensed, GPL-3.0 compatible.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde_json = "1"

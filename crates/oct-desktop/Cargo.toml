[package]
name = "oct-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The oct desktop application"

[[bin]]
name = "oct-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oct-core = { workspace = true }
oct-platform = { workspace = true }
oct-store = { workspace = true }
oct-scan = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
# `serde` is already a workspace dependency (and already in `Cargo.lock` as a transitive dependency
# of `tauri`); the commands need it directly to derive `Serialize` for the values they return over
# IPC. No new crate enters the dependency graph.
serde = { workspace = true }
tauri-plugin-dialog = "2.8.3"

[dev-dependencies]
# `serde_json` is already a workspace dependency and already in `Cargo.lock` through `tauri`, so this
# adds no crate to the graph. It is needed to assert a SERIALISED OUTPUT contract: that the transient
# single-author projection keeps emitting an explicit `null` instead of omitting the key.
serde_json = { workspace = true }
